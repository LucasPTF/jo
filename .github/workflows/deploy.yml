      - name: Create .htaccess
        run: |
          cat > .htaccess << 'EOF'
          RewriteEngine On

          RewriteRule ^$ /angulo1 [R=302,L]

          RewriteRule ^angulo1/?$ /index.html [L]
          RewriteRule ^angulo2/?$ /index.html [L]
          RewriteRule ^angulo3/?$ /index.html [L]

          RewriteRule ^obrigado/?$ /obrigado.html [L]

          RewriteCond %{REQUEST_FILENAME} -f [OR]
          RewriteCond %{REQUEST_FILENAME} -d
          RewriteRule ^ - [L]
          EOF

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: /
          timeout: 120000
          dangerous-clean-slate: false
          dry-run: false
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
